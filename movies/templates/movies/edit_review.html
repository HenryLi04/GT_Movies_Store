{% extends "base.html" %}

{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1>Edit Review</h1>

                    <p class="text-muted">
                        Movie:
                        {{ template_data.review.movie.name }}
                    </p>

                    <form method="post">
                        {% csrf_token %}

                        {{ template_data.form.as_p }}

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Changes
                        </button>

                        <a
                            href="{% url 'movies.show' id=template_data.review.movie.id %}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock content %}
