{% extends "base.html" %}

{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card border-danger shadow-sm">
                <div class="card-body p-4">
                    <h1>Delete Review</h1>

                    <p>
                        Are you sure you want to delete this review?
                    </p>

                    <blockquote class="blockquote">
                        {{ template_data.review.content }}
                    </blockquote>

                    <form method="post">
                        {% csrf_token %}

                        <button
                            type="submit"
                            class="btn btn-danger"
                        >
                            Delete Review
                        </button>

                        <a
                            href="{% url 'movies.show' id=template_data.review.movie.id %}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock content %}
